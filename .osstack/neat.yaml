version: 1

instructions:
  canonical: AGENTS.md
  mirrors:
    - path: CLAUDE.md
      mode: import_or_symlink

required_surfaces:
  - id: readme
    path: README.md
    severity: error
  - id: readme-zh
    path: README.zh.md
    severity: error
  - id: firstmate-command-guide-en
    path: docs/guides/firstmate-commands.en.md
    severity: error
  - id: firstmate-command-guide-zh
    path: docs/guides/firstmate-commands.md
    severity: error
  - id: docs-index-en
    path: docs/README.md
    severity: error
  - id: docs-index-zh
    path: docs/README.zh.md
    severity: error
  - id: install-upgrade-en
    path: docs/guides/install-upgrade.en.md
    severity: error
  - id: install-upgrade-zh
    path: docs/guides/install-upgrade.md
    severity: error
  - id: docs-maintenance-en
    path: docs/guides/documentation-maintenance.en.md
    severity: error
  - id: docs-maintenance-zh
    path: docs/guides/documentation-maintenance.md
    severity: error
  - id: architecture-decisions
    path: docs/decisions
    kind: directory
    severity: warning
  - id: cli-command-inventory
    path: docs/inventory/CLI_COMMANDS.md
    severity: warning

budgets:
  - id: agent-context
    path: AGENTS.md
    warn:
      lines: 120
      bytes: 16384
    error:
      lines: 200
      bytes: 32768

contracts:
  - id: cli-public-surface
    when:
      any_path:
        - packages/cli/src/**
    review:
      any_path:
        - README.md
        - README.zh.md
        - docs/guides/firstmate-commands.en.md
        - docs/guides/firstmate-commands.md
        - docs/inventory/CLI_COMMANDS.md
    enforcement: advisory
  - id: neat-governance-surface
    when:
      any_path:
        - packages/governance/src/knowledge-hygiene/**
    review:
      any_path:
        - docs/2026-07-17-neat-product-technical-spec-v2.md
        - docs/decisions/ADR-002-neat-knowledge-hygiene-boundary.md
        - docs/superpowers/plans/2026-07-17-neat-implementation-plan.md
    enforcement: advisory

# Immutable audit inputs retain the relative links from their original source
# locations. Validate the live documents, not those quoted historical bytes.
ignore:
  - rule_id: reference.markdown_target_missing
    paths:
      - docs/reports/2026-10-23-firstmate-evidence/claude-round*-context.md
      - docs/implementation/graph-contained-reopen-evidence/handoff-draft.md
    reason: Frozen audit/handoff input copies; source-relative links are evidence, not live navigation.
