name: Release

# Release train: changesets accumulate on main; this workflow maintains a
# "Version Packages" PR. Merging that PR on a train day (every other Friday,
# see RELEASING.md) versions + publishes every changed package to npm and
# tags the release.
#
# Publishing requires the NPM_TOKEN secret (npm automation token with publish
# rights to the @osstack scope). Until that secret is configured the publish
# step is skipped and the workflow only manages the Version PR.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "README.zh.md"
      - "CHANGELOG.md"

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm version comes from package.json's packageManager field
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Neat semantic beta contract gates
        run: |
          pnpm smoke:neat
          pnpm eval:neat-goldens
          pnpm eval:neat-parity:corpus
          pnpm eval:neat-parity:offline

      - name: Release plan smoke
        run: pnpm smoke:release-plan

      - name: Knowledge Cloud smoke
        run: pnpm smoke:knowledge-cloud

      - name: Knowledge Cloud deploy asset smoke
        run: pnpm smoke:knowledge-cloud:deploy

      - name: Deliver proof smoke
        run: pnpm smoke:deliver-proof

      - name: Single binary release archive smoke
        run: pnpm smoke:single-binary-release-pack

      - name: Build single binary archive candidate
        run: |
          OUT="dist/single-binary/darwin-arm64"
          pnpm build:single-binary -- --output-dir "$OUT" --json
          MANIFEST="$(ls "$OUT"/osstack-*-darwin-arm64.manifest.json | head -n 1)"
          pnpm sign:single-binary -- --manifest "$MANIFEST" --identity - --json
          pnpm sbom:single-binary -- --manifest "$MANIFEST" --json
          pnpm package:single-binary -- --manifest "$MANIFEST" --json

      - name: Upload single binary archive candidate
        uses: actions/upload-artifact@v7
        with:
          name: osstack-single-binary-darwin-arm64-candidate
          path: |
            dist/single-binary/darwin-arm64/osstack-*.tar.gz
            dist/single-binary/darwin-arm64/osstack-*.archive.json
            dist/single-binary/darwin-arm64/osstack-*.manifest.json
            dist/single-binary/darwin-arm64/osstack-*.sbom.spdx.json
            dist/single-binary/darwin-arm64/sha256sums.txt
          if-no-files-found: error
          retention-days: 14

      - name: NPM install smoke
        run: pnpm smoke:npm-install

      - name: NPM preflight smoke
        run: pnpm smoke:npm-preflight

      - name: Detect npm token
        id: npm-token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN not configured — will manage the Version PR but skip publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require npm token for version package commits
        if: "${{ steps.npm-token.outputs.present != 'true' && startsWith(github.event.head_commit.message, 'chore(release): version packages') }}"
        run: |
          echo "Version package commits must publish to npm. Configure repository secret NPM_TOKEN and rerun." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Preflight npm publish access
        if: "${{ steps.npm-token.outputs.present == 'true' }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm preflight:npm-publish

      - name: Version PR / Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ steps.npm-token.outputs.present == 'true' && secrets.NPM_TOKEN || '' }}
          NODE_AUTH_TOKEN: ${{ steps.npm-token.outputs.present == 'true' && secrets.NPM_TOKEN || '' }}
          NPM_CONFIG_PROVENANCE: "true"
