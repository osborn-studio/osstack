name: Knowledge Cloud Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger EdgeOne deployment when EDGEONE_DEPLOY_HOOK_URL is configured"
        type: boolean
        default: false

concurrency: knowledge-cloud-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Knowledge Cloud tests
        run: pnpm --filter @osstack/knowledge-cloud test

      - name: Knowledge Cloud smoke
        run: pnpm smoke:knowledge-cloud

      - name: Deploy asset smoke
        run: pnpm smoke:knowledge-cloud:deploy

      - name: Docker build
        run: docker build -f Dockerfile.knowledge-cloud -t osstack-knowledge-cloud:${{ github.sha }} .

      - name: Detect EdgeOne deploy hook
        id: edgeone-deploy-hook
        run: |
          if [ -n "${{ secrets.EDGEONE_DEPLOY_HOOK_URL }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EDGEONE_DEPLOY_HOOK_URL not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require EdgeOne deploy hook for deploy
        if: ${{ inputs.deploy && steps.edgeone-deploy-hook.outputs.present != 'true' }}
        run: |
          echo "deploy=true requires repository secret EDGEONE_DEPLOY_HOOK_URL." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Trigger EdgeOne deploy
        if: ${{ inputs.deploy && steps.edgeone-deploy-hook.outputs.present == 'true' }}
        run: |
          curl -fsS -X POST "$EDGEONE_DEPLOY_HOOK_URL"
        env:
          EDGEONE_DEPLOY_HOOK_URL: ${{ secrets.EDGEONE_DEPLOY_HOOK_URL }}

      - name: Deployment summary
        run: |
          if [ "${{ inputs.deploy }}" != "true" ]; then
            echo "Deployment input was false; validation-only run completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Knowledge Cloud deploy completed." >> "$GITHUB_STEP_SUMMARY"
          fi
