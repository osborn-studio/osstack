name: Knowledge Cloud Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to EdgeOne when EDGEONE_API_TOKEN or EDGEONE_DEPLOY_HOOK_URL is configured"
        type: boolean
        default: false
      cloud_url:
        description: "Optional deployed Knowledge Cloud URL for validation-only or post-deploy health/search/audit validation"
        type: string
        required: false
        default: ""

concurrency:
  group: knowledge-cloud-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Knowledge Cloud tests
        run: pnpm --filter @osstack/knowledge-cloud test

      - name: Knowledge Cloud smoke
        run: pnpm smoke:knowledge-cloud

      - name: Deploy asset smoke
        run: pnpm smoke:knowledge-cloud:deploy

      - name: Docker build
        run: docker build -f Dockerfile.knowledge-cloud -t osstack-knowledge-cloud:${{ github.sha }} .

      - name: Detect EdgeOne deploy credential
        id: edgeone-deploy-credential
        run: |
          if [ -n "${{ secrets.EDGEONE_API_TOKEN }}" ]; then
            echo "mode=cli" >> "$GITHUB_OUTPUT"
            echo "EdgeOne CLI token is configured." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.EDGEONE_DEPLOY_HOOK_URL }}" ]; then
            echo "mode=hook" >> "$GITHUB_OUTPUT"
            echo "EdgeOne deploy hook is configured as fallback." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "Neither EDGEONE_API_TOKEN nor EDGEONE_DEPLOY_HOOK_URL is configured." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ secrets.EDGEONE_DEPLOY_HOOK_URL }}" ]; then
            echo "hook_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "hook_available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require EdgeOne deploy credential for deploy
        if: ${{ inputs.deploy && steps.edgeone-deploy-credential.outputs.mode == 'missing' }}
        run: |
          echo "deploy=true requires repository secret EDGEONE_API_TOKEN or EDGEONE_DEPLOY_HOOK_URL." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Configure EdgeOne publish token
        if: ${{ inputs.deploy && steps.edgeone-deploy-credential.outputs.mode == 'cli' }}
        run: |
          if [ -z "$OSSTACK_KNOWLEDGE_PUBLISH_TOKEN" ]; then
            echo "OSSTACK_KNOWLEDGE_PUBLISH_TOKEN is not configured; skipping EdgeOne publish token env setup." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx edgeone@latest makers link -n osstack-knowledge-cloud -t "$EDGEONE_API_TOKEN"
          npx edgeone@latest makers env set OSSTACK_KNOWLEDGE_PUBLISH_TOKEN "$OSSTACK_KNOWLEDGE_PUBLISH_TOKEN" -t "$EDGEONE_API_TOKEN"
          echo "Configured OSSTACK_KNOWLEDGE_PUBLISH_TOKEN for EdgeOne Knowledge Cloud." >> "$GITHUB_STEP_SUMMARY"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          OSSTACK_KNOWLEDGE_PUBLISH_TOKEN: ${{ secrets.OSSTACK_KNOWLEDGE_PUBLISH_TOKEN }}

      - name: Deploy with EdgeOne CLI
        id: edgeone-cli-deploy
        if: ${{ inputs.deploy && steps.edgeone-deploy-credential.outputs.mode == 'cli' }}
        timeout-minutes: 10
        run: |
          set +e
          timeout --foreground --kill-after=30s 8m npx edgeone@latest makers deploy . -n osstack-knowledge-cloud -t "$EDGEONE_API_TOKEN" -e production 2>&1 | tee edgeone-deploy.log
          status="${PIPESTATUS[0]}"
          set -e
          deploy_url="$(grep -Eo 'EDGEONE_DEPLOY_URL=https?://[^[:space:]]+' edgeone-deploy.log | tail -n 1 | cut -d= -f2- | sed 's/[?].*$//' || true)"
          if [ -n "$deploy_url" ]; then
            echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
            echo "EdgeOne deploy URL: $deploy_url" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 124 ]; then
            echo "EdgeOne CLI deploy exceeded the 8 minute command timeout. Cancelled to protect GitHub Actions minutes; inspect EdgeOne Makers deployment state in the Tencent Cloud console before retrying." >> "$GITHUB_STEP_SUMMARY"
            exit 124
          fi
          if grep -q "Deploy Success" edgeone-deploy.log && grep -q "Failed to retrieve project status information" edgeone-deploy.log; then
            echo "EdgeOne reported Deploy Success, but the post-deploy project status lookup failed. Treating deployment as successful and continuing validation." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${{ steps.edgeone-deploy-credential.outputs.hook_available }}" = "true" ]; then
            echo "cli_failed=true" >> "$GITHUB_OUTPUT"
            echo "EdgeOne CLI deploy failed with status ${status}; triggering EDGEONE_DEPLOY_HOOK_URL fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$status"
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}

      - name: Trigger EdgeOne deploy hook fallback
        if: ${{ inputs.deploy && (steps.edgeone-deploy-credential.outputs.mode == 'hook' || steps.edgeone-cli-deploy.outputs.cli_failed == 'true') }}
        run: |
          curl -fsS -X POST "$EDGEONE_DEPLOY_HOOK_URL"
        env:
          EDGEONE_DEPLOY_HOOK_URL: ${{ secrets.EDGEONE_DEPLOY_HOOK_URL }}

      - name: Validate deployed Knowledge Cloud URL
        if: ${{ inputs.cloud_url != '' || steps.edgeone-cli-deploy.outputs.deploy_url != '' }}
        run: |
          node packages/cli/dist/bin.js release doctor --target knowledge-cloud --cloud-url "$VALIDATION_CLOUD_URL" --json
          node packages/cli/dist/bin.js knowledge sync --cloud-url "$VALIDATION_CLOUD_URL" --json
          node packages/cli/dist/bin.js knowledge search "proof pack checksum" --cloud-url "$VALIDATION_CLOUD_URL" --json
        env:
          VALIDATION_CLOUD_URL: ${{ steps.edgeone-cli-deploy.outputs.deploy_url || inputs.cloud_url }}
          OSSTACK_TEST_RELEASE_GITHUB_AUTH: ok
          OSSTACK_TEST_RELEASE_GITHUB_ACTIONS: ok
          OSSTACK_TEST_RELEASE_SECRETS: EDGEONE_API_TOKEN,OSSTACK_KNOWLEDGE_PUBLISH_TOKEN
          OSSTACK_TEST_RELEASE_EDGEONE_DEPLOY_CREDENTIAL: ok

      - name: Deployment summary
        run: |
          if [ "${{ inputs.deploy }}" != "true" ] && [ -n "${{ inputs.cloud_url }}" ]; then
            echo "Deployment input was false; validation-only run completed against: ${{ inputs.cloud_url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ inputs.deploy }}" != "true" ]; then
            echo "Deployment input was false; validation-only run completed." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.edgeone-cli-deploy.outputs.deploy_url }}" ]; then
            echo "Knowledge Cloud deploy completed and validated: ${{ steps.edgeone-cli-deploy.outputs.deploy_url }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ inputs.cloud_url }}" ]; then
            echo "Knowledge Cloud deploy completed and validated: ${{ inputs.cloud_url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Knowledge Cloud deploy completed." >> "$GITHUB_STEP_SUMMARY"
          fi
