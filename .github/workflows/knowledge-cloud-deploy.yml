name: Knowledge Cloud Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Fly.io when FLY_API_TOKEN is configured"
        type: boolean
        default: false

concurrency: knowledge-cloud-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Knowledge Cloud tests
        run: pnpm --filter @osstack/knowledge-cloud test

      - name: Knowledge Cloud smoke
        run: pnpm smoke:knowledge-cloud

      - name: Deploy asset smoke
        run: pnpm smoke:knowledge-cloud:deploy

      - name: Docker build
        run: docker build -f Dockerfile.knowledge-cloud -t osstack-knowledge-cloud:${{ github.sha }} .

      - name: Detect Fly token
        id: fly-token
        run: |
          if [ -n "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "FLY_API_TOKEN not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require Fly token for deploy
        if: ${{ inputs.deploy && steps.fly-token.outputs.present != 'true' }}
        run: |
          echo "deploy=true requires repository secret FLY_API_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ inputs.deploy && steps.fly-token.outputs.present == 'true' }}

      - name: Deploy to Fly.io
        if: ${{ inputs.deploy && steps.fly-token.outputs.present == 'true' }}
        run: flyctl deploy --config deploy/knowledge-cloud/fly.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deployment summary
        run: |
          if [ "${{ inputs.deploy }}" != "true" ]; then
            echo "Deployment input was false; validation-only run completed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Knowledge Cloud deploy completed." >> "$GITHUB_STEP_SUMMARY"
          fi
